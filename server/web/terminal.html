<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Same-origin only; WASM eval + inline styles for restty; ws: for the
         PTY bridge. Served from localhost (and later fronted by nginx). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:"
    />
    <title>familiar</title>
    <!-- SVG favicon: currentColor with no surrounding CSS resolves to black,
         which is the deliberate choice — the mark stays legible on any tab
         strip without committing to an accent that is still under debate. -->
    <link rel="icon" type="image/svg+xml" href="/app/familiar-mark-16.svg" />
    <!-- iOS home-screen bookmark: opaque teal squircle master at 180x180. -->
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="terminal"></div>
      <div id="toast-stack" aria-live="polite"></div>
    </div>
    <div id="drop-hint">Drop to capture</div>
    <script type="module" src="/app/terminal.js"></script>
  </body>
</html>
