<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- familiar — macOS app icon master.
       Accent teal from oklch(0.68 0.12 170); precise sRGB base #32b08d.
       Big Sur convention: rounded squircle (r = 22.37% of 1024 = 229), a
       top-left specular sheen (light source top-left), vertical darkening to
       the bottom, and a faint inner top edge highlight. Mark strokes near-white
       with a soft drop shadow so it reads as sitting on the surface. -->
  <defs>
    <!-- Body: top-lit vertical gradient, lighter above, darker below. -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#61d7b2"/>
      <stop offset="0.5" stop-color="#32b08d"/>
      <stop offset="1"   stop-color="#008767"/>
    </linearGradient>
    <!-- Specular sheen: soft white bloom anchored top-left. -->
    <radialGradient id="sheen" cx="0.30" cy="0.22" r="0.85">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom darkening for grounded weight. -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#00463a" stop-opacity="0.30"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229"/>
    </clipPath>
    <!-- Soft shadow so the mark reads as lifted off the surface. -->
    <filter id="markshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00332a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#body)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#floor)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"/>
  </g>

  <!-- Inner top-edge highlight: a hairline of light along the upper rim. -->
  <rect x="3" y="3" width="1018" height="1018" rx="226" ry="226"
        fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>

  <!-- The familiar mark, near-white, scaled from its 100-unit space (S=7.6),
       centered with a slight optical lift. tx=132, ty=200.8. -->
  <g transform="translate(132 200.8) scale(7.6)" filter="url(#markshadow)"
     fill="none" stroke="#f6fffb">
    <defs><clipPath id="hornclip"><rect x="0" y="0" width="100" height="25"/></clipPath></defs>
    <g clip-path="url(#hornclip)">
      <path d="M38 26 C34 21 34 14 38 10" stroke-width="6" stroke-linecap="round"/>
      <path d="M62 26 C66 21 66 14 62 10" stroke-width="6" stroke-linecap="round"/>
    </g>
    <rect x="24" y="25" width="52" height="38" rx="10" stroke-width="6"/>
    <path d="M37 44 H51" stroke-width="5" stroke-linecap="round"/>
    <circle cx="62" cy="44" r="3" fill="#f6fffb" stroke="none"/>
    <path d="M34 60 L48 60 L32 74 Z" fill="#f6fffb" stroke="none"/>
  </g>
</svg>
