<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'"
    />
    <title>Familiar — offline</title>
    <style>
      /* Offline shell fallback. This page is shown precisely WHEN the familiar
         server is unreachable, so it CANNOT fetch the runtime /theme.css. These
         literals are therefore a static mirror of the gruvbox defaults
         (services/gateway/src/theme/defaults.json) — keep them in sync by hand. */
      :root {
        --bg: #282828;
        --fg: #ebdbb2;
        --muted: #bdae93;
        --accent: #8ec07c;
        --panel: #1d2021;
        --border: #3c3836;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
      }
      /* Slim draggable strip so a frameless window can still be moved. */
      #drag {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 24px;
        -webkit-app-region: drag;
      }
      #wrap {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        padding: 24px;
        text-align: center;
      }
      .glyph {
        font-size: 40px;
        opacity: 0.8;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 34rem;
        line-height: 1.5;
        font-size: 13.5px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px 6px;
      }
      button {
        -webkit-app-region: no-drag;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        color: var(--bg);
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        padding: 9px 20px;
      }
      button:hover {
        filter: brightness(1.08);
      }
      #detail {
        color: #928374;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #countdown {
        color: var(--muted);
        font-size: 12px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div id="drag"></div>
    <div id="wrap">
      <div class="glyph">⚯</div>
      <h1>Can't reach the familiar server</h1>
      <p>
        The window loads the terminal from
        <code id="url">the configured server</code>. It isn't responding — the
        server may be down, or you may be offline. This retries automatically;
        you can also retry now.
      </p>
      <button id="retry">Retry</button>
      <div id="countdown"></div>
      <div id="detail"></div>
    </div>
    <script>
      // The main process appends ?url=<base>&err=<code> when it loads this page.
      const params = new URLSearchParams(location.search);
      const base = params.get("url");
      const err = params.get("err");
      if (base) document.getElementById("url").textContent = base;
      if (err) document.getElementById("detail").textContent = err;

      // Retrying just asks main to (re)load the base URL. Exposed on the
      // preload bridge as familiar.retry(); fall back to reload if unavailable.
      function retry() {
        if (window.familiar && typeof window.familiar.retry === "function") {
          window.familiar.retry();
        } else {
          location.reload();
        }
      }
      document.getElementById("retry").addEventListener("click", retry);

      // Auto-retry with a visible countdown. Backoff is owned by main (it decides
      // when to re-point at this page); here we just nudge on an interval.
      let n = 8;
      const cd = document.getElementById("countdown");
      function tick() {
        cd.textContent = `retrying in ${n}s…`;
        if (n <= 0) {
          retry();
          return;
        }
        n -= 1;
        setTimeout(tick, 1000);
      }
      tick();
    </script>
  </body>
</html>
