# Familiar Presence Runtime's complete tmux configuration.
# This file is copied to private runtime state and passed with tmux -f when the
# private server is created. User and system tmux configuration is never read.
set-option -g status off
set-option -g pane-border-status off
set-option -g remain-on-exit on
set-option -g exit-empty off
set-option -g destroy-unattached off
set-option -g allow-rename off
set-option -g prefix C-b
unbind-key C-b
bind-key C-b send-prefix

# Both the Presence window (inner kitty graphics) and Viewer window (sidebar
# and nested output) must forward explicitly wrapped terminal protocol
# sequences. "all" also permits a repaint while a pane is not visible.
set-option -gw allow-passthrough all

# Preserve modified-key reporting across both the outer Viewer and nested
# Presence tmux clients. xterm covers common SSH/browser terminals; tmux and
# screen cover the nested client; kitty covers direct native attaches.
set-option -g extended-keys on
set-option -g extended-keys-format csi-u
set-option -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title:extkeys,rxvt*:ignorefkeys,tmux*:extkeys,kitty*:extkeys'
