<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Deployment CSP belongs at the reverse proxy. This page is served both
         directly and behind authenticated HTTPS proxies, and restty needs WASM,
         WebSockets, dynamic styles, and locally served font buffers. A baked-in
         meta policy cannot account for those deployment origins and is additive
         with (rather than overridden by) proxy response headers. -->
    <title>familiar</title>
    <!-- SVG favicon: currentColor with no surrounding CSS resolves to black,
         which is the deliberate choice — the mark stays legible on any tab
         strip without committing to an accent that is still under debate. -->
    <link rel="icon" type="image/svg+xml" href="/app/familiar-mark-16.svg" />
    <!-- iOS home-screen bookmark: opaque teal squircle master at 180x180. -->
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <!-- Runtime theme: generated by the server from FAMILIAR_THEME_* at boot.
         Loaded BEFORE style.css so its :root vars are in scope. -->
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/app/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="terminal"></div>
      <div id="voice-indicator" aria-live="polite"></div>
      <div id="toast-stack" aria-live="polite"></div>
    </div>
    <div id="drop-hint">Drop to capture</div>
    <script type="module" src="/app/terminal.js"></script>
  </body>
</html>
