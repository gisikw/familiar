# Familiar Presence Runtime's complete tmux configuration.
# This file is copied to private runtime state and passed with tmux -f when the
# private server is created. User and system tmux configuration is never read.
set-option -g status off
set-option -g pane-border-status off
set-option -g exit-empty off
set-option -g destroy-unattached off
set-option -g allow-rename off
set-option -g prefix C-b
unbind-key C-b
bind-key C-b send-prefix

# Let tmux arbitrate mouse input using the actual pane state: wheel events over
# ordinary programs enter copy mode, while mouse-aware programs receive them.
set-option -g mouse on
# presence.sh appends the generated Familiar mode-style,
# copy-mode-mark-style, and copy-mode-position-style options to the private
# runtime copy of this file. Colors therefore always come from defaults.json.
# PageUp starts history paging for primary-screen programs, but full-screen
# alternate-screen programs (such as pi) receive the key unchanged.
bind-key -n PageUp if-shell -F '#{alternate_on}' 'send-keys PageUp' 'copy-mode -eu'
# The inner Presence window must forward explicitly wrapped terminal protocol
# sequences from pi through the native viewer's embedded PTY. "all" also
# permits output while the attached client is not visible.
set-option -gw allow-passthrough all

# Preserve modified-key reporting across the inner Presence attach. xterm
# covers common clients; tmux and screen cover nested clients; kitty and
# Ghostty cover direct native-viewer attaches.
set-option -g extended-keys on
set-option -g extended-keys-format csi-u
set-option -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title:extkeys,rxvt*:ignorefkeys,tmux*:extkeys,kitty*:extkeys,ghostty*:clipboard:ccolour:cstyle:focus:title:extkeys,xterm-ghostty:clipboard:ccolour:cstyle:focus:title:extkeys'
